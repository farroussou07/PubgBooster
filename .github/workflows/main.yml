name: Build PUBG Booster APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Extract Project ZIP
      run: |
        find . -maxdepth 2 -name "*.zip" -exec unzip -o {} \; || true

    - name: Fix Missing Icons and Resources
      run: |
        sed -i 's/@mipmap\/ic_launcher/@android:drawable\/sym_def_app_icon/g' app/src/main/AndroidManifest.xml || true
        sed -i '/roundIcon/d' app/src/main/AndroidManifest.xml || true
        touch app/proguard-rules.pro || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      run: |
        gradle assembleDebug --no-daemon

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: PUBG-Ultra-Booster-APK
        path: app/build/outputs/apk/debug/app-debug.apk
